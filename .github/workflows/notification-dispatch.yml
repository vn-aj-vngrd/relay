name: Notification delivery

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-delivery
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch pending notifications
        env:
          DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
        run: |
          test -n "$DISPATCH_SECRET"
          curl --fail --silent --show-error \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_SECRET" \
            https://relay.vanajvanguardia.tech/api/notifications/dispatch
